name: Check
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php tests/lint.php
      - run: php tests/run.php
  wordpress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wp: ['6.5', 'latest']
        php: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package.py
      - run: python tests/translation-check.py
      - run: node --check prihod/assets/schedule-admin.js
      - run: node --check prihod/assets/blocks.js && node --check prihod-theme/assets/editor.js && node --check prihod-theme/assets/media.js && node --check prihod-theme/assets/forms.js && node --check prihod-theme/assets/settings.js
      - name: Set test versions
        env:
          TEST_WP: ${{ matrix.wp }}
          TEST_PHP: ${{ matrix.php }}
        run: node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('tests/blueprint.json')); b.preferredVersions={wp:process.env.TEST_WP,php:process.env.TEST_PHP}; fs.writeFileSync(process.env.RUNNER_TEMP+'/prihod-blueprint.json',JSON.stringify(b));"
      - run: npx --yes @wp-playground/cli@latest run-blueprint --mount-dir ./prihod /wordpress/wp-content/plugins/prihod --mount-dir ./prihod-theme /wordpress/wp-content/themes/prihod-theme --mount-dir ./build/packages/prihod-telegram /wordpress/wp-content/plugins/prihod-telegram --mount-dir ./build/packages/prihod-whatsapp /wordpress/wp-content/plugins/prihod-whatsapp --mount-dir ./build/packages/prihod-social /wordpress/wp-content/plugins/prihod-social --mount-dir ./tests /wordpress/wp-content/plugins/prihod-tests --mount-dir ./scripts /wordpress/wp-content/prihod-demo-source --blueprint "$RUNNER_TEMP/prihod-blueprint.json"
